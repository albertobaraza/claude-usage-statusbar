name: Release

# On a push to main: if package.json names a version that has no GitHub release yet, build the .vsix
# and publish the release (tag vX.Y.Z, the matching CHANGELOG.md section as its notes, the .vsix
# attached). Nothing to trigger by hand: a version is released by merging the pull request that
# bumped it.
#
# A push to main is not tested again here. Main takes only a pull request whose required checks
# (test.yaml and ci.yml) passed on a branch that was up to date with main (scripts/protect-main.sh:
# strict status checks, enforced for admins too), so the merged tree is the tree that was tested.
# A manual run is the exception: it can start on any commit, so it runs the test workflow first.
#
# Publishing the same .vsix to the VS Code Marketplace is a second, opt-in job: it runs only when
# the repository variable PUBLISH_TO_MARKETPLACE is "true". It signs in with Marketplace trusted
# publishing (OIDC): no token is stored, but the publisher needs a policy for this workflow file
# (docs/RELEASING.md). Run this workflow by hand on main to retry a failed publish.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# One release at a time on main. Keyed by ref, so a manual run on another branch is a different group and can never take the
# place of a run of main that is waiting.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Only a manual run tests: a push to main was tested by its pull request (see the top of this file).
  test:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/test.yaml

  release:
    name: GitHub release
    needs: test
    # Only main releases. A manual run (workflow_dispatch) can be started on any branch, and a branch must not be able to
    # tag a release or, below, publish to the Marketplace: that would go around the protection of main.
    # On a push the test job is skipped, and a job whose dependency was skipped is skipped too unless it says otherwise:
    # hence !cancelled() with an explicit check that the tests did not fail. A failed or cancelled test stops the release.
    if: >-
      !cancelled()
      && (needs.test.result == 'success' || needs.test.result == 'skipped')
      && github.repository == 'albertobaraza/claude-limits-meter'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      vsix_name: ${{ steps.vsix.outputs.name }}
      vsix_sha256: ${{ steps.vsix.outputs.sha256 }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Read the version and check it against the changelog
        id: meta
        run: |
          node scripts/release-metadata.js check-changelog
          version="$(node scripts/release-metadata.js version)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if gh release view "v${version}" > /dev/null 2>&1; then
            echo "Release v${version} already exists: nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # No install scripts: this job holds a token that can write to the repository. Built on every run, also when the
      # release exists already (a manual retry of a failed publish), so that the file published is always a build of the
      # commit this run is on, and never a file that was lying around.
      - name: Build the .vsix
        run: |
          npm ci --ignore-scripts
          npm run package

      # The checksum is computed here, by this job, and checked by the publish job before it publishes anything.
      - name: Record the checksum of the .vsix
        id: vsix
        run: |
          set -euo pipefail
          files=(./*.vsix)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "Expected exactly one .vsix, found ${#files[@]}." >&2
            exit 1
          fi
          echo "name=$(basename "${files[0]}")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "${files[0]}" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # Handed to the publish job as an artifact of this run: nothing of anybody else's can take its place on the way.
      - name: Keep the .vsix for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vsix
          path: ./*.vsix
          if-no-files-found: error
          retention-days: 1

      - name: Publish the GitHub release
        if: steps.meta.outputs.exists == 'false'
        run: |
          node scripts/release-metadata.js notes "${VERSION}" > "${RUNNER_TEMP}/notes.md"
          gh release create "v${VERSION}" ./*.vsix \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            --latest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}

  publish:
    name: VS Code Marketplace
    needs: release
    # The implicit success() of an if: without a status function also looks at the ancestors of release: on a push the
    # test job is skipped, so without !cancelled() this job would be skipped too and nothing would ever be published.
    # needs.release.result keeps the rule that a release that did not succeed publishes nothing.
    if: >-
      !cancelled()
      && needs.release.result == 'success'
      && vars.PUBLISH_TO_MARKETPLACE == 'true'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # lets vsce ask GitHub for the OIDC token the Marketplace trusts
    env:
      VERSION: ${{ needs.release.outputs.version }}
      VSIX_NAME: ${{ needs.release.outputs.vsix_name }}
      VSIX_SHA256: ${{ needs.release.outputs.vsix_sha256 }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      # The file the Marketplace gets is the one the release job built in this run, not whatever the GitHub release
      # holds under that tag: release assets and tags can be replaced by anyone with write access, and the checksum below
      # is the one the release job computed.
      - name: Download the .vsix built in this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: dist

      - name: Check it is the file the release job built
        run: |
          set -euo pipefail
          if [ "$(find dist -type f | wc -l)" -ne 1 ] || [ ! -f "dist/${VSIX_NAME}" ]; then
            echo "dist must hold exactly dist/${VSIX_NAME}." >&2
            exit 1
          fi
          echo "${VSIX_SHA256}  dist/${VSIX_NAME}" | sha256sum -c -

      - name: Install vsce
        run: npm ci --ignore-scripts

      - name: Publish unless this version is already there
        run: |
          id="$(node -p "const p = require('./package.json'); p.publisher + '.' + p.name")"
          published="$(npx vsce show "${id}" --json 2> /dev/null | node -e "
            let s = ''; process.stdin.on('data', (d) => (s += d)).on('end', () => {
              try { console.log(JSON.parse(s).versions[0].version); } catch { console.log(''); }
            });")"
          if [ "${published}" = "${VERSION}" ]; then
            echo "${id} ${VERSION} is already on the Marketplace: nothing to do."
          else
            npx vsce publish --oidc --packagePath "dist/${VSIX_NAME}"
          fi
